<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" width="960" height="336" role="img" aria-labelledby="t d">
  <title id="t">The project in numbers</title>
  <desc id="d">8,110 functions named. About three days from first plan to public release. More than 70 AI agent runs. 24 of 28 story missions won by an autopilot. 0 crashes in 948 mission runs of the crash soak tests. 16 bugs of the original game fixed in Remastered.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#112036"/>
      <stop offset="1" stop-color="#0b1626"/>
    </linearGradient>
  </defs>
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- row 1 -->
    <g transform="translate(0,0)">
      <rect x="1" y="1" width="306" height="158" rx="16" fill="url(#tile)" stroke="#24405f" stroke-width="1.5"/>
      <rect x="24" y="26" width="36" height="4" rx="2" fill="#ff4a5f"/>
      <text x="24" y="86" font-size="46" font-weight="800" fill="#f4f7fb">8,110</text>
      <text x="24" y="118" font-size="17" fill="#b4c3d4">functions named: the whole</text>
      <text x="24" y="140" font-size="17" fill="#b4c3d4">program, each with evidence</text>
    </g>
    <g transform="translate(326,0)">
      <rect x="1" y="1" width="306" height="158" rx="16" fill="url(#tile)" stroke="#24405f" stroke-width="1.5"/>
      <rect x="24" y="26" width="36" height="4" rx="2" fill="#ff4a5f"/>
      <text x="24" y="86" font-size="46" font-weight="800" fill="#f4f7fb">~3 days</text>
      <text x="24" y="118" font-size="17" fill="#b4c3d4">from the first plan to the</text>
      <text x="24" y="140" font-size="17" fill="#b4c3d4">first public release</text>
    </g>
    <g transform="translate(652,0)">
      <rect x="1" y="1" width="306" height="158" rx="16" fill="url(#tile)" stroke="#24405f" stroke-width="1.5"/>
      <rect x="24" y="26" width="36" height="4" rx="2" fill="#ff4a5f"/>
      <text x="24" y="86" font-size="46" font-weight="800" fill="#f4f7fb">70+</text>
      <text x="24" y="118" font-size="17" fill="#b4c3d4">AI agent runs: naming, formats,</text>
      <text x="24" y="140" font-size="17" fill="#b4c3d4">fixes, Remastered, installer</text>
    </g>
    <!-- row 2 -->
    <g transform="translate(0,176)">
      <rect x="1" y="1" width="306" height="158" rx="16" fill="url(#tile)" stroke="#24405f" stroke-width="1.5"/>
      <rect x="24" y="26" width="36" height="4" rx="2" fill="#4fb3ff"/>
      <text x="24" y="86" font-size="46" font-weight="800" fill="#f4f7fb">24 / 28</text>
      <text x="24" y="118" font-size="17" fill="#b4c3d4">story missions won by an</text>
      <text x="24" y="140" font-size="17" fill="#b4c3d4">autopilot playing the port</text>
    </g>
    <g transform="translate(326,176)">
      <rect x="1" y="1" width="306" height="158" rx="16" fill="url(#tile)" stroke="#24405f" stroke-width="1.5"/>
      <rect x="24" y="26" width="36" height="4" rx="2" fill="#4fb3ff"/>
      <text x="24" y="86" font-size="46" font-weight="800" fill="#f4f7fb">0 crashes</text>
      <text x="24" y="118" font-size="17" fill="#b4c3d4">in 948 mission runs of the</text>
      <text x="24" y="140" font-size="17" fill="#b4c3d4">crash soak tests</text>
    </g>
    <g transform="translate(652,176)">
      <rect x="1" y="1" width="306" height="158" rx="16" fill="url(#tile)" stroke="#24405f" stroke-width="1.5"/>
      <rect x="24" y="26" width="36" height="4" rx="2" fill="#4fb3ff"/>
      <text x="24" y="86" font-size="46" font-weight="800" fill="#f4f7fb">16</text>
      <text x="24" y="118" font-size="17" fill="#b4c3d4">bugs of the 2001 game fixed in</text>
      <text x="24" y="140" font-size="17" fill="#b4c3d4">Remastered, each with a switch</text>
    </g>
  </g>
</svg>
